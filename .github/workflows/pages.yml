name: Validate Cheese Vault
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cheese-vault-website-validation
  cancel-in-progress: false
jobs:
  frontend:
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:contracts
      - run: npm run build
      - run: npm run check:export
      - run: npx playwright install --with-deps chromium
      - name: Browser regression tests (mocked network, no signing)
        run: |
          npm run preview > /tmp/cheese-vault-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5174/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
      # Native Cloudflare Pages Git integration owns deployment.
